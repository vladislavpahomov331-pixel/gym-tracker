<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<title>Gym Tracker</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0a;
    color: #e5e5e5;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .header {
    display: flex;
    align-items: center;
    padding: 16px;
    background: #141414;
    border-bottom: 1px solid #222;
    gap: 12px;
    flex-shrink: 0;
  }
  .back-btn {
    background: none;
    border: none;
    color: #4a9eff;
    font-size: 16px;
    padding: 4px 8px;
    cursor: pointer;
    display: none;
    font-weight: 500;
  }
  .back-btn.visible {
    display: block;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    flex: 1;
  }
  .header .sub {
    font-size: 12px;
    color: #888;
    font-weight: 400;
  }

  /* MAIN TABS */
  .main-tabs {
    display: flex;
    background: #141414;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
  }
  .main-tab {
    flex: 1;
    padding: 12px 4px;
    text-align: center;
    font-size: 13px;
    color: #666;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-weight: 500;
    transition: all 0.15s;
  }
  .main-tab.active {
    color: #4a9eff;
    border-bottom-color: #4a9eff;
  }
  .main-tab .icon {
    display: block;
    font-size: 18px;
    margin-bottom: 2px;
  }

  /* DATE BAR */
  .date-bar {
    background: #141414;
    border-bottom: 1px solid #222;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: #888;
    flex-shrink: 0;
  }
  .date-bar .today {
    color: #e5e5e5;
    font-weight: 600;
  }
  .date-bar .streak {
    color: #ff9500;
    font-weight: 700;
  }

  .workout-timer {
    background: #141414;
    border-bottom: 1px solid #222;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: #888;
    flex-shrink: 0;
  }
  .workout-timer .val {
    color: #4a9eff;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* REST TIMER */
  .rest-timer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #1a1a1a;
    border-top: 2px solid #4a9eff;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom)) 16px;
    display: none;
    align-items: center;
    justify-content: space-between;
    z-index: 100;
    animation: slideUp 0.3s ease;
  }
  .rest-timer.show {
    display: flex;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .rest-timer .rest-label {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .rest-timer .rest-val {
    font-size: 28px;
    color: #4a9eff;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .rest-timer .rest-btn {
    background: #262626;
    border: none;
    color: #e5e5e5;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .rest-timer .rest-btn:active {
    background: #333;
  }
  .rest-timer .rest-btn.stop {
    background: #3a1a1a;
    color: #ff6b6b;
  }

  .content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
  }

  /* TRAINING CARDS */
  .training-card {
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .training-card:active {
    background: #222;
    transform: scale(0.98);
  }
  .training-card .label {
    font-size: 28px;
    font-weight: 800;
    color: #4a9eff;
    margin-bottom: 4px;
  }
  .training-card .name {
    font-size: 15px;
    color: #e5e5e5;
    margin-bottom: 8px;
  }
  .training-card .count {
    font-size: 13px;
    color: #666;
  }
  .training-card .last {
    font-size: 12px;
    color: #666;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #262626;
  }

  /* EXERCISE ITEM */
  .exercise-wrapper {
    margin-bottom: 8px;
  }
  .exercise-item {
    display: flex;
    align-items: center;
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.15s;
    gap: 10px;
  }
  .exercise-item:active {
    background: #222;
    transform: scale(0.98);
  }
  .exercise-item .num {
    width: 28px;
    height: 28px;
    background: #262626;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: #888;
    flex-shrink: 0;
  }
  .exercise-item .info {
    flex: 1;
    min-width: 0;
  }
  .exercise-item .ex-name {
    font-size: 15px;
    color: #fff;
    font-weight: 500;
    margin-bottom: 2px;
  }
  .exercise-item .ex-prev {
    font-size: 12px;
    color: #666;
  }
  .exercise-item .arrow {
    color: #444;
    font-size: 18px;
    flex-shrink: 0;
  }
  .exercise-item .skip-btn {
    background: #262626;
    border: none;
    color: #888;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
  }
  .exercise-item .skip-btn:active {
    background: #333;
  }
  .exercise-item.skipped {
    opacity: 0.5;
  }
  .exercise-item.skipped .ex-name {
    text-decoration: line-through;
    color: #888;
  }

  .move-btns {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .move-btn {
    background: #262626;
    border: none;
    color: #888;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .move-btn:active {
    background: #333;
  }
  .move-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* SETS TABLE */
  .sets-header {
    display: grid;
    grid-template-columns: 40px 1fr 1fr;
    gap: 8px;
    padding: 0 4px 8px 4px;
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .sets-header > div {
    text-align: center;
  }
  .set-row {
    display: grid;
    grid-template-columns: 40px 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  .set-num {
    text-align: center;
    font-size: 14px;
    color: #666;
    font-weight: 600;
  }
  .set-input {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 12px 8px;
    font-size: 16px;
    color: #fff;
    text-align: center;
    font-weight: 600;
    width: 100%;
    -webkit-appearance: none;
    font-family: inherit;
  }
  .set-input:focus {
    outline: none;
    border-color: #4a9eff;
    background: #1f1f1f;
  }
  .set-input::-webkit-outer-spin-button,
  .set-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .set-input[type=number] {
    -moz-appearance: textfield;
  }
  .set-input.prev {
    color: #666;
    background: #141414;
    border-color: #1f1f1f;
  }
  .set-input.current {
    color: #fff;
  }

  /* NOTES */
  .notes-input {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    color: #fff;
    width: 100%;
    font-family: inherit;
    resize: none;
    min-height: 80px;
    line-height: 1.4;
  }
  .notes-input:focus {
    outline: none;
    border-color: #4a9eff;
  }
  .notes-input::placeholder {
    color: #444;
  }

  .section-title {
    font-size: 13px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    margin: 20px 0 12px 4px;
  }
  .section-title:first-child {
    margin-top: 0;
  }

  /* BUTTONS */
  .btn {
    background: #4a9eff;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    width: 100%;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .btn:active {
    background: #3a8eef;
    transform: scale(0.98);
  }
  .btn.secondary {
    background: #262626;
    color: #e5e5e5;
  }
  .btn.secondary:active {
    background: #333;
  }
  .btn.success {
    background: #2a5a2a;
    color: #a5e5a5;
  }
  .btn.success:active {
    background: #356a35;
  }
  .btn.danger {
    background: #3a1a1a;
    color: #ff6b6b;
  }
  .btn.danger:active {
    background: #4a2020;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .btn-row .btn {
    flex: 1;
  }

  /* HISTORY */
  .history-workout {
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .history-workout-header {
    padding: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .history-workout-header:active {
    background: #222;
  }
  .history-workout-header .badge {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: #4a9eff;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 800;
    flex-shrink: 0;
  }
  .history-workout-header .meta {
    flex: 1;
    min-width: 0;
  }
  .history-workout-header .meta .title {
    font-size: 14px;
    color: #fff;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .history-workout-header .meta .sub {
    font-size: 12px;
    color: #666;
  }
  .history-workout-header .chev {
    color: #444;
    font-size: 18px;
    transition: transform 0.2s;
  }
  .history-workout.expanded .history-workout-header .chev {
    transform: rotate(90deg);
  }
  .history-workout-body {
    display: none;
    padding: 0 14px 14px 14px;
    border-top: 1px solid #262626;
  }
  .history-workout.expanded .history-workout-body {
    display: block;
  }
  .history-ex {
    padding: 10px 0;
    border-bottom: 1px solid #1f1f1f;
  }
  .history-ex:last-child {
    border-bottom: none;
  }
  .history-ex .name {
    font-size: 13px;
    color: #e5e5e5;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .history-ex .name.skipped {
    text-decoration: line-through;
    color: #666;
  }
  .history-ex .sets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .history-ex .set-chip {
    background: #262626;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    color: #e5e5e5;
    font-weight: 500;
  }
  .history-ex .set-chip.skipped {
    background: #2a1a1a;
    color: #ff6b6b;
  }
  .history-ex .note {
    font-size: 12px;
    color: #888;
    margin-top: 6px;
    font-style: italic;
  }

  /* HISTORY ITEM (внутри упражнения) */
  .history-item {
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 8px;
  }
  .history-item .date {
    font-size: 13px;
    color: #4a9eff;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .history-item .sets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .history-item .set-chip {
    background: #262626;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    color: #e5e5e5;
    font-weight: 500;
  }
  .history-item .note {
    font-size: 12px;
    color: #888;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #262626;
    font-style: italic;
  }

  /* GRAPH */
  .graph-selector {
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 15px;
    color: #fff;
    width: 100%;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .graph-selector:active {
    background: #222;
  }
  .graph-selector .placeholder {
    color: #666;
  }
  .graph-selector .val {
    color: #4a9eff;
    font-weight: 600;
  }
  .exercise-picker {
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 12px;
    margin-bottom: 16px;
    max-height: 400px;
    overflow-y: auto;
    display: none;
  }
  .exercise-picker.show {
    display: block;
  }
  .picker-group-title {
    padding: 12px 16px 6px 16px;
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 700;
  }
  .picker-item {
    padding: 12px 16px;
    font-size: 14px;
    color: #e5e5e5;
    cursor: pointer;
    border-bottom: 1px solid #1f1f1f;
  }
  .picker-item:last-child {
    border-bottom: none;
  }
  .picker-item:active {
    background: #222;
  }
  .picker-item.selected {
    color: #4a9eff;
    font-weight: 600;
  }

  .graph-container {
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .graph-title {
    font-size: 13px;
    color: #888;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .graph-svg {
    width: 100%;
    height: 180px;
  }
  .graph-stats {
    display: flex;
    gap: 16px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #262626;
  }
  .graph-stats .stat {
    flex: 1;
  }
  .graph-stats .stat-label {
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .graph-stats .stat-value {
    font-size: 18px;
    color: #fff;
    font-weight: 700;
  }

  /* TABS (внутри упражнения) */
  .tabs {
    display: flex;
    background: #141414;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-size: 14px;
    color: #666;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-weight: 500;
    transition: all 0.15s;
  }
  .tab.active {
    color: #4a9eff;
    border-bottom-color: #4a9eff;
  }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #444;
  }
  .empty .icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.5;
  }
  .empty .text {
    font-size: 15px;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: calc(90px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #2a2a2a;
    color: #fff;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    transition: transform 0.3s;
    z-index: 1000;
    pointer-events: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    white-space: nowrap;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="rest-timer" id="restTimer">
  <div>
    <div class="rest-label">Отдых</div>
    <div class="rest-val" id="restVal">01:30</div>
  </div>
  <button class="rest-btn stop" onclick="stopRestTimer()">Стоп</button>
</div>

<script>
// ============================================================
// DATA
// ============================================================
const TRAININGS = {
  A: {
    name: 'Грудь, бицепс',
    exercises: [
      'Жим от груди',
      'Жим в Хаммере',
      'Жим в наклонной скамье',
      'Бабочка',
      'Подъём EZ-штанги на бицепс',
      'Подъём на бицепс на скамье',
      'Скамья Скотта'
    ]
  },
  B: {
    name: 'Спина, трицепс',
    exercises: [
      'Подтягивания с резинкой',
      'Тяга верхнего блока',
      'Тяга в тренажёре',
      'Тяга на середину спины в тренажёре',
      'Французский жим из-за головы',
      'Трицепс в кроссовере',
      'Гиперэкстензия'
    ]
  },
  D: {
    name: 'Ноги, плечи',
    exercises: [
      'Жим платформы',
      'Разгибание ног сидя',
      'Разгибание ног лёжа',
      'Армейский жим в тренажёре',
      'Разведение в кроссовере на заднюю дельту',
      'Разведение в кроссовере на среднюю дельту',
      'Махи гантелей в стороны'
    ]
  }
};

const DEFAULT_REST_SECONDS = 90;
const STORAGE_KEY = 'gym_tracker_data_v2';

// ============================================================
// STORAGE
// ============================================================
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { workouts: [] };
    return JSON.parse(raw);
  } catch(e) {
    return { workouts: [] };
  }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let DB = loadData();

// ============================================================
// STATE
// ============================================================
let state = {
  screen: 'home',
  mainTab: 'workouts',
  training: null,
  exerciseIndex: null,
  tab: 'workout',
  selectedExercise: null,
  pickerOpen: false,
  expandedWorkouts: {}
};

let workoutTimerInterval = null;
let restTimerInterval = null;
let restSecondsLeft = 0;

// ============================================================
// HELPERS
// ============================================================
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDate(iso) {
  const [y, m, d] = iso.split('-');
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function todayLong() {
  const d = new Date();
  const days = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
}

function daysBetween(iso1, iso2) {
  const d1 = new Date(iso1 + 'T00:00:00');
  const d2 = new Date(iso2 + 'T00:00:00');
  return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
}

function humanDaysAgo(iso) {
  const diff = daysBetween(iso, today());
  if (diff === 0) return 'сегодня';
  if (diff === 1) return 'вчера';
  if (diff === 2) return '2 дня назад';
  if (diff === 3) return '3 дня назад';
  if (diff < 7) return `${diff} дней назад`;
  return formatDate(iso);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function lastWorkout(training) {
  const filtered = DB.workouts
    .filter(w => w.training === training)
    .sort((a, b) => b.date.localeCompare(a.date));
  return filtered[0] || null;
}

function lastExerciseRecord(training, exerciseName) {
  const filtered = DB.workouts
    .filter(w => w.training === training && w.exercises)
    .sort((a, b) => b.date.localeCompare(a.date));

  for (const w of filtered) {
    if (!w.exercises) continue;
    for (const ex of w.exercises) {
      if (ex.name === exerciseName && ex.sets && ex.sets.length > 0) {
        return { workout: w, exercise: ex };
      }
    }
  }
  return null;
}

function currentWorkout(training) {
  const t = today();
  return DB.workouts.find(w =>
    w.training === training &&
    w.date === t &&
    !w.finished
  );
}

function getOrCreateWorkout(training) {
  let w = currentWorkout(training);
  if (!w) {
    w = {
      id: Date.now(),
      training: training,
      date: today(),
      startedAt: Date.now(),
      finished: false,
      exercises: TRAININGS[training].exercises.map(name => ({
        name: name,
        sets: [],
        note: '',
        skipped: false,
        order: TRAININGS[training].exercises.indexOf(name)
      }))
    };
    DB.workouts.push(w);
    saveData(DB);
  }
  w.exercises.forEach((ex, i) => {
    if (!ex.name) ex.name = TRAININGS[training].exercises[i];
    if (ex.order === undefined) ex.order = i;
    if (ex.skipped === undefined) ex.skipped = false;
  });
  if (!w.startedAt) {
    w.startedAt = Date.now();
    saveData(DB);
  }
  return w;
}

function calcStreak() {
  const sorted = DB.workouts
    .filter(w => w.finished)
    .sort((a, b) => b.date.localeCompare(a.date));

  if (sorted.length === 0) return 0;

  let streak = 1;
  for (let i = 0; i < sorted.length - 1; i++) {
    const diff = daysBetween(sorted[i+1].date, sorted[i].date);
    if (diff <= 2) {
      streak++;
    } else {
      break;
    }
  }
  return streak;
}

function allExercises() {
  const result = [];
  for (const key of ['A', 'B', 'D']) {
    TRAININGS[key].exercises.forEach(ex => {
      result.push({ training: key, name: ex });
    });
  }
  return result;
}

// ============================================================
// WORKOUT TIMER
// ============================================================
function startWorkoutTimer() {
  if (workoutTimerInterval) clearInterval(workoutTimerInterval);
  workoutTimerInterval = setInterval(updateWorkoutTimer, 1000);
  updateWorkoutTimer();
}

function stopWorkoutTimer() {
  if (workoutTimerInterval) {
    clearInterval(workoutTimerInterval);
    workoutTimerInterval = null;
  }
}

function updateWorkoutTimer() {
  const el = document.getElementById('workout-timer-val');
  if (!el) return;
  if (!state.training) return;
  const w = currentWorkout(state.training);
  if (!w || !w.startedAt) return;
  const elapsed = Math.floor((Date.now() - w.startedAt) / 1000);
  el.textContent = formatTime(elapsed);
}

// ============================================================
// REST TIMER
// ============================================================
function startRestTimer(seconds) {
  restSecondsLeft = seconds || DEFAULT_REST_SECONDS;
  const el = document.getElementById('restTimer');
  const val = document.getElementById('restVal');

  el.classList.add('show');
  val.textContent = formatTime(restSecondsLeft);

  if (restTimerInterval) clearInterval(restTimerInterval);
  restTimerInterval = setInterval(() => {
    restSecondsLeft--;
    if (restSecondsLeft <= 0) {
      stopRestTimer();
      showToast('Отдых закончен 💪');
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      return;
    }
    val.textContent = formatTime(restSecondsLeft);
  }, 1000);
}

function stopRestTimer() {
  if (restTimerInterval) {
    clearInterval(restTimerInterval);
    restTimerInterval = null;
  }
  const el = document.getElementById('restTimer');
  if (el) el.classList.remove('show');
}

// ============================================================
// RENDER
// ============================================================
function render() {
  const app = document.getElementById('app');

  if (state.screen === 'home') {
    app.innerHTML = renderHome();

  } else if (state.screen === 'training') {
    app.innerHTML = renderTraining();
    startWorkoutTimer();
  } else if (state.screen === 'exercise') {
    app.innerHTML = renderExercise();
    if (!workoutTimerInterval && state.training) startWorkoutTimer();
  }
}

    w.exercises.forEach(ex => {

function renderExerciseGraph(training, exName) {
  const all = DB.workouts
    .filter(w => w.training === training && w.exercises)
    .sort((a, b) => a.date.localeCompare(b.date));

  const points = [];
  all.forEach(w => {
    const ex = w.exercises.find(e => e.name === exName);
    if (ex && ex.sets && ex.sets.length > 0) {
      const maxW = Math.max(...ex.sets.map(s => parseFloat(s.weight) || 0));
      if (maxW > 0) points.push({ date: w.date, value: maxW });
    }
  });

  if (points.length < 2) {
    return `<div class="empty"><div class="icon">📈</div><div class="text">Нужно минимум 2 тренировки с этим упражнением</div></div>`;
  }

  const maxV = Math.max(...points.map(p => p.value));
  const minV = Math.min(...points.map(p => p.value));
  const range = maxV - minV || 1;

  const W = 300;
  const H = 180;
  const padX = 10;
  const padY = 20;
  const graphW = W - padX * 2;
  const graphH = H - padY * 2;

  const coords = points.map((p, i) => {
    const x = padX + (i / (points.length - 1)) * graphW;
    const y = padY + graphH - ((p.value - minV) / range) * graphH;
    return { x, y, ...p };
  });

  const pathD = coords.map((c, i) => `${i === 0 ? 'M' : 'L'} ${c.x} ${c.y}`).join(' ');

  let svg = `<svg class="graph-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;

  for (let i = 0; i <= 4; i++) {
    const y = padY + (i / 4) * graphH;
    svg += `<line x1="${padX}" y1="${y}" x2="${W-padX}" y2="${y}" stroke="#262626" stroke-width="1"/>`;
  }

  svg += `<path d="${pathD}" fill="none" stroke="#4a9eff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;

  coords.forEach(c => {
    svg += `<circle cx="${c.x}" cy="${c.y}" r="4" fill="#4a9eff"/>`;
  });

  svg += `</svg>`;

  const first = points[0].value;
  const last = points[points.length - 1].value;
  const diff = last - first;
  const diffText = diff > 0 ? `+${diff}` : `${diff}`;

  return `
    <div class="graph-container">
      <div class="graph-title">Максимальный вес по тренировкам</div>
      ${svg}
      <div class="graph-stats">
        <div class="stat">
          <div class="stat-label">Сейчас</div>
          <div class="stat-value">${last} кг</div>
        </div>
        <div class="stat">
          <div class="stat-label">Прогресс</div>
          <div class="stat-value" style="color:${diff >= 0 ? '#4a9eff' : '#ff6b6b'}">${diffText} кг</div>
        </div>
        <div class="stat">
          <div class="stat-label">Тренировок</div>
          <div class="stat-value">${points.length}</div>
        </div>
      </div>
    </div>
  `;
}

function togglePicker() {

}

function selectExercise(training, name) {

// ---------- TRAINING SCREEN ----------
function renderTraining() {
  const t = TRAININGS[state.training];
  const workout = getOrCreateWorkout(state.training);

  const sorted = [...workout.exercises].sort((a, b) => (a.order || 0) - (b.order || 0));

  let html = `
    <div class="header">
      <button class="back-btn visible" onclick="goHome()">‹ Назад</button>
      <div style="flex:1">
        <h1>Тренировка ${state.training}</h1>
        <div class="sub">${t.name}</div>
      </div>
    </div>
    <div class="workout-timer">
      <span>⏱ Время тренировки</span>
      <span class="val" id="workout-timer-val">00:00</span>
    </div>
    <div class="content">
  `;

  sorted.forEach((ex, displayIndex) => {
    const rec = ex;
    const done = rec.sets && rec.sets.length > 0;
    const isSkipped = rec.skipped;

    const lastRec = lastExerciseRecord(state.training, rec.name);
    let prevText = 'Нет данных';
    if (lastRec) {
      prevText = lastRec.exercise.sets.map(s => `${s.weight}×${s.reps}`).join(', ');
    }

    const realIndex = workout.exercises.indexOf(rec);
    const canMoveUp = displayIndex > 0;
    const canMoveDown = displayIndex < sorted.length - 1;

    let numBg = '#262626';
    let numColor = '#888';
    let numText = displayIndex + 1;

    if (done) {
      numBg = '#4a9eff';
      numColor = '#fff';
      numText = '✓';
    }
    if (isSkipped) {
      numBg = '#3a2a1a';
      numColor = '#ff9500';
      numText = '−';
    }

    html += `
      <div class="exercise-wrapper">
        <div class="exercise-item ${isSkipped ? 'skipped' : ''}">
          <div class="num" style="background:${numBg};color:${numColor}">${numText}</div>
          <div class="info" onclick="openExercise(${realIndex})">
            <div class="ex-name">${rec.name}</div>
            <div class="ex-prev">${prevText}</div>
          </div>
          <div class="move-btns">
            <button class="move-btn" onclick="event.stopPropagation(); moveExercise(${realIndex}, -1)" ${canMoveUp ? '' : 'disabled'}>↑</button>
            <button class="move-btn" onclick="event.stopPropagation(); moveExercise(${realIndex}, 1)" ${canMoveDown ? '' : 'disabled'}>↓</button>
          </div>
          <button class="skip-btn" onclick="event.stopPropagation(); toggleSkip(${realIndex})">${isSkipped ? '↺' : '−'}</button>
        </div>
      </div>
    `;
  });

  html += `
      <div class="btn-row">
        <button class="btn success" onclick="finishWorkout()">✅ Завершить тренировку</button>
      </div>
      <div class="btn-row">
        <button class="btn danger" onclick="cancelWorkout()">🗑 Отменить тренировку</button>
      </div>
    </div>
  `;

  return html;
}

function renderExercise() {

  const rec = workout.exercises[state.exerciseIndex];
  const exName = rec.name;

    rec.sets = lastSets.map(s => ({ weight: s.weight, reps: s.reps }));
    saveData(DB);
  }

  const currentSets = rec.sets.length > 0 ? rec.sets : [{weight:'', reps:''}];

  let html = `

      <button class="back-btn visible" onclick="backToTraining()">‹ Назад</button>

      <div class="tab" onclick="switchTab('graph')">График</div>
    </div>
    <div class="content">
  `;

  if (state.tab === 'workout') {
    html += `
      <div class="section-title">Прошлая тренировка</div>
      <div class="sets-header">
        <div>#</div>
        <div>Вес (кг)</div>
        <div>Повторы</div>
      </div>

      html += `<div style="text-align:center;color:#444;padding:20px;font-size:14px">Нет данных</div>`;

        html += `
          <div class="set-row">
            <div class="set-num">${i+1}</div>

            <input class="set-input prev" type="number" value="${s.reps}" disabled>
          </div>
        `;
      });
    }

    html += `
      <div class="section-title">Эта тренировка</div>
      <div class="sets-header">
        <div>#</div>
        <div>Вес (кг)</div>
        <div>Повторы</div>
      </div>
      <div id="current-sets"></div>
      <div class="btn-row">
        <button class="btn secondary" onclick="removeSet()">− Убрать</button>
        <button class="btn secondary" onclick="addSet()">+ Добавить</button>
      </div>
      <div class="btn-row">
        <button class="btn success" onclick="saveSet()">✅ Сохранить подход</button>
      </div>
      <div class="btn-row">
        <button class="btn secondary" onclick="finishExercise()">🏁 Завершить упражнение</button>

                placeholder="Как прошло? Что запомнить?"

      </div>

    html += renderExerciseGraph(state.training, exName);
  }

  html += `</div>`;

  setTimeout(() => {
    if (state.tab === 'workout') renderCurrentSets(currentSets);
  }, 0);

  return html;

function renderCurrentSets(sets) {
  const container = document.getElementById('current-sets');
  if (!container) return;

  let html = '';
  sets.forEach((s, i) => {
    html += `
      <div class="set-row">
        <div class="set-num">${i+1}</div>
        <input class="set-input current" type="number" inputmode="decimal"
               value="${s.weight}" placeholder="—"
               oninput="updateSet(${i}, 'weight', this.value)">
        <input class="set-input current" type="number" inputmode="numeric"
               value="${s.reps}" placeholder="—"
               oninput="updateSet(${i}, 'reps', this.value)">
      </div>
    `;
  });
  container.innerHTML = html;
}

function renderExerciseHistory(exName) {
  const all = DB.workouts
    .filter(w => w.training === state.training && w.exercises)
    .sort((a, b) => b.date.localeCompare(a.date));

  const history = [];
  all.forEach(w => {
    const ex = w.exercises.find(e => e.name === exName);
    if (ex && ex.sets && ex.sets.length > 0) {
      history.push({ date: w.date, sets: ex.sets, note: ex.note });
    }
  });

  if (history.length === 0) {
    return `<div class="empty"><div class="icon">📊</div><div class="text">Нет данных</div></div>`;
  }

  let html = '';
  history.forEach(h => {
    html += `
      <div class="history-item">
        <div class="date">${formatDate(h.date)}</div>
        <div class="sets">
          ${h.sets.map(s => `<div class="set-chip">${s.weight} × ${s.reps}</div>`).join('')}
        </div>
        ${h.note ? `<div class="note">📝 ${h.note}</div>` : ''}
      </div>
    `;
  });
  return html;
}

  state.exerciseIndex = null;

}

function addSet() {
  const workout = getOrCreateWorkout(state.training);
  const rec = workout.exercises[state.exerciseIndex];
  if (rec.sets.length === 0) {
    rec.sets.push({weight:'', reps:''});
  }
  rec.sets.push({weight:'', reps:''});
  saveData(DB);
  render();
}

function removeSet() {
  const workout = getOrCreateWorkout(state.training);
  const rec = workout.exercises[state.exerciseIndex];
  if (rec.sets.length > 1) {
    rec.sets.pop();
    saveData(DB);
  }
  render();
}

function updateSet(index, field, value) {
  const workout = getOrCreateWorkout(state.training);
  const rec = workout.exercises[state.exerciseIndex];
  if (!rec.sets[index]) rec.sets[index] = {weight:'', reps:''};
  rec.sets[index][field] = value;
  saveData(DB);
}

function updateNote(value) {
  const workout = getOrCreateWorkout(state.training);
  const rec = workout.exercises[state.exerciseIndex];
  rec.note = value;
  saveData(DB);
}

function saveNote() {
  showToast('Заметка сохранена 📝');
}

function saveSet() {
  const workout = getOrCreateWorkout(state.training);
  const rec = workout.exercises[state.exerciseIndex];

  rec.sets = rec.sets.filter(s => s.weight !== '' && s.reps !== '');
  saveData(DB);

  startRestTimer(DEFAULT_REST_SECONDS);
  showToast('Подход сохранён ✓ Отдых пошёл');

  render();
}

function finishExercise() {
  const workout = getOrCreateWorkout(state.training);
  const rec = workout.exercises[state.exerciseIndex];

  rec.sets = rec.sets.filter(s => s.weight !== '' && s.reps !== '');
  saveData(DB);

  stopRestTimer();
  showToast('Упражнение завершено ✓');
  backToTraining();
}

function moveExercise(realIndex, direction) {
  const workout = getOrCreateWorkout(state.training);
  const exercises = workout.exercises;

  const sorted = [...exercises].sort((a, b) => (a.order || 0) - (b.order || 0));
  const currentPos = sorted.indexOf(exercises[realIndex]);
  const swapPos = currentPos + direction;

  if (swapPos < 0 || swapPos >= sorted.length) return;

  const other = sorted[swapPos];
  const currentOrder = exercises[realIndex].order || 0;
  const otherOrder = other.order || 0;

  exercises[realIndex].order = otherOrder;
  other.order = currentOrder;

  saveData(DB);
  render();
}

function toggleSkip(realIndex) {
  const workout = getOrCreateWorkout(state.training);
  const rec = workout.exercises[realIndex];
  rec.skipped = !rec.skipped;
  saveData(DB);
  render();
}

function finishWorkout() {
  const workout = getOrCreateWorkout(state.training);
  const done = workout.exercises.filter(e => e.sets.length > 0 || e.skipped).length;

  if (done === 0) {
    showToast('Нет сохранённых упражнений');
    return;
  }

  const elapsed = workout.startedAt ? Math.floor((Date.now() - workout.startedAt) / 1000) : 0;
  workout.duration = elapsed;
  workout.finished = true;
  workout.finishedAt = Date.now();
  saveData(DB);

  stopWorkoutTimer();
  stopRestTimer();

  showToast(`Тренировка завершена! Время: ${formatTime(elapsed)}`);
  setTimeout(goHome, 1500);
}

// Отменить тренировку — полностью удалить текущую незавершённую
function cancelWorkout() {
  if (!confirm('Точно отменить тренировку? Все введённые данные будут удалены.')) {
    return;
  }

  const w = currentWorkout(state.training);
  if (w) {
    DB.workouts = DB.workouts.filter(x => x.id !== w.id);
    saveData(DB);
  }

  stopWorkoutTimer();
  stopRestTimer();

  showToast('Тренировка отменена');
  setTimeout(goHome, 800);
}

// ============================================================
// INIT
// ============================================================
render();
</script>
