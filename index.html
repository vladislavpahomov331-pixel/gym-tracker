<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<title>Gym Tracker</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0a;
    color: #e5e5e5;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  
  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    padding: 16px;
    background: #141414;
    border-bottom: 1px solid #222;
    gap: 12px;
    flex-shrink: 0;
  }
  .back-btn {
    background: none;
    border: none;
    color: #4a9eff;
    font-size: 16px;
    padding: 4px 8px;
    cursor: pointer;
    display: none;
    font-weight: 500;
  }
  .back-btn.visible {
    display: block;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    flex: 1;
  }
  .header .sub {
    font-size: 12px;
    color: #888;
    font-weight: 400;
  }
  
  /* WORKOUT TIMER */
  .workout-timer {
    background: #141414;
    border-bottom: 1px solid #222;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: #888;
    flex-shrink: 0;
  }
  .workout-timer .val {
    color: #4a9eff;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  
  /* REST TIMER */
  .rest-timer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #1a1a1a;
    border-top: 2px solid #4a9eff;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom)) 16px;
    display: none;
    align-items: center;
    justify-content: space-between;
    z-index: 100;
    animation: slideUp 0.3s ease;
  }
  .rest-timer.show {
    display: flex;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .rest-timer .rest-label {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .rest-timer .rest-val {
    font-size: 28px;
    color: #4a9eff;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .rest-timer .rest-btn {
    background: #262626;
    border: none;
    color: #e5e5e5;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .rest-timer .rest-btn:active {
    background: #333;
  }
  .rest-timer .rest-btn.stop {
    background: #3a1a1a;
    color: #ff6b6b;
  }
  
  /* CONTENT */
  .content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
  }
  
  /* TRAINING CARDS */
  .training-card {
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .training-card:active {
    background: #222;
    transform: scale(0.98);
  }
  .training-card .label {
    font-size: 28px;
    font-weight: 800;
    color: #4a9eff;
    margin-bottom: 4px;
  }
  .training-card .name {
    font-size: 15px;
    color: #e5e5e5;
    margin-bottom: 8px;
  }
  .training-card .count {
    font-size: 13px;
    color: #666;
  }
  .training-card .last {
    font-size: 12px;
    color: #666;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #262626;
  }
  
  /* EXERCISE LIST */
  .exercise-item {
    display: flex;
    align-items: center;
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
    gap: 12px;
  }
  .exercise-item:active {
    background: #222;
    transform: scale(0.98);
  }
  .exercise-item .num {
    width: 28px;
    height: 28px;
    background: #262626;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: #888;
    flex-shrink: 0;
  }
  .exercise-item .info {
    flex: 1;
    min-width: 0;
  }
  .exercise-item .ex-name {
    font-size: 15px;
    color: #fff;
    font-weight: 500;
    margin-bottom: 2px;
  }
  .exercise-item .ex-prev {
    font-size: 12px;
    color: #666;
  }
  .exercise-item .arrow {
    color: #444;
    font-size: 18px;
    flex-shrink: 0;
  }
  
  /* SETS TABLE */
  .sets-header {
    display: grid;
    grid-template-columns: 40px 1fr 1fr;
    gap: 8px;
    padding: 0 4px 8px 4px;
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .sets-header > div {
    text-align: center;
  }
  .set-row {
    display: grid;
    grid-template-columns: 40px 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  .set-num {
    text-align: center;
    font-size: 14px;
    color: #666;
    font-weight: 600;
  }
  .set-input {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 12px 8px;
    font-size: 16px;
    color: #fff;
    text-align: center;
    font-weight: 600;
    width: 100%;
    -webkit-appearance: none;
    font-family: inherit;
  }
  .set-input:focus {
    outline: none;
    border-color: #4a9eff;
    background: #1f1f1f;
  }
  .set-input::-webkit-outer-spin-button,
  .set-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .set-input[type=number] {
    -moz-appearance: textfield;
  }
  .set-input.prev {
    color: #666;
    background: #141414;
    border-color: #1f1f1f;
  }
  .set-input.current {
    color: #fff;
  }
  
  /* NOTES */
  .notes-input {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    color: #fff;
    width: 100%;
    font-family: inherit;
    resize: none;
    min-height: 80px;
    line-height: 1.4;
  }
  .notes-input:focus {
    outline: none;
    border-color: #4a9eff;
  }
  .notes-input::placeholder {
    color: #444;
  }
  
  .section-title {
    font-size: 13px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    margin: 20px 0 12px 4px;
  }
  .section-title:first-child {
    margin-top: 0;
  }
  
  /* BUTTONS */
  .btn {
    background: #4a9eff;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    width: 100%;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .btn:active {
    background: #3a8eef;
    transform: scale(0.98);
  }
  .btn.secondary {
    background: #262626;
    color: #e5e5e5;
  }
  .btn.secondary:active {
    background: #333;
  }
  .btn.success {
    background: #2a5a2a;
    color: #a5e5a5;
  }
  .btn.success:active {
    background: #356a35;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .btn-row .btn {
    flex: 1;
  }
  
  /* HISTORY */
  .history-item {
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 8px;
  }
  .history-item .date {
    font-size: 13px;
    color: #4a9eff;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .history-item .sets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .history-item .set-chip {
    background: #262626;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    color: #e5e5e5;
    font-weight: 500;
  }
  .history-item .note {
    font-size: 12px;
    color: #888;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #262626;
    font-style: italic;
  }
  
  /* GRAPH */
  .graph-container {
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .graph-title {
    font-size: 13px;
    color: #888;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .graph-svg {
    width: 100%;
    height: 180px;
  }
  .graph-stats {
    display: flex;
    gap: 16px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #262626;
  }
  .graph-stats .stat {
    flex: 1;
  }
  .graph-stats .stat-label {
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .graph-stats .stat-value {
    font-size: 18px;
    color: #fff;
    font-weight: 700;
  }
  
  /* TABS */
  .tabs {
    display: flex;
    background: #141414;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-size: 14px;
    color: #666;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-weight: 500;
    transition: all 0.15s;
  }
  .tab.active {
    color: #4a9eff;
    border-bottom-color: #4a9eff;
  }
  
  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #444;
  }
  .empty .icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.5;
  }
  .empty .text {
    font-size: 15px;
  }
  
  /* TOAST */
  .toast {
    position: fixed;
    bottom: calc(90px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #2a2a2a;
    color: #fff;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    transition: transform 0.3s;
    z-index: 1000;
    pointer-events: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    white-space: nowrap;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="rest-timer" id="restTimer">
  <div>
    <div class="rest-label">Отдых</div>
    <div class="rest-val" id="restVal">01:30</div>
  </div>
  <button class="rest-btn stop" onclick="stopRestTimer()">Стоп</button>
</div>

<script>
// ============================================================
// DATA
// ============================================================
const TRAININGS = {
  A: {
    name: 'Грудь, бицепс',
    exercises: [
      'Жим от груди',
      'Жим в Хаммере',
      'Жим в наклонной скамье',
      'Бабочка',
      'Подъём EZ-штанги на бицепс',
      'Подъём на бицепс на скамье',
      'Скамья Скотта'
    ]
  },
  B: {
    name: 'Спина, трицепс',
    exercises: [
      'Подтягивания с резинкой',
      'Тяга верхнего блока',
      'Тяга в тренажёре',
      'Тяга на середину спины в тренажёре',
      'Французский жим из-за головы',
      'Трицепс в кроссовере',
      'Гиперэкстензия'
    ]
  },
  D: {
    name: 'Ноги, плечи',
    exercises: [
      'Жим платформы',
      'Разгибание ног сидя',
      'Разгибание ног лёжа',
      'Армейский жим в тренажёре',
      'Разведение в кроссовере на заднюю дельту',
      'Разведение в кроссовере на среднюю дельту',
      'Махи гантелей в стороны'
    ]
  }
};

const DEFAULT_REST_SECONDS = 90;

// ============================================================
// STORAGE
// ============================================================
const STORAGE_KEY = 'gym_tracker_data_v2';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { workouts: [] };
    return JSON.parse(raw);
  } catch(e) {
    return { workouts: [] };
  }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let DB = loadData();

// ============================================================
// STATE
// ============================================================
let state = {
  screen: 'home',
  training: null,
  exerciseIndex: null,
  tab: 'workout'
};

let workoutTimerInterval = null;
let restTimerInterval = null;
let restSecondsLeft = 0;

// ============================================================
// HELPERS
// ============================================================
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDate(iso) {
  const [y, m, d] = iso.split('-');
  const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function lastWorkout(training) {
  const filtered = DB.workouts
    .filter(w => w.training === training)
    .sort((a, b) => b.date.localeCompare(a.date));
  return filtered[0] || null;
}

function lastExerciseRecord(training, exerciseIndex) {
  const filtered = DB.workouts
    .filter(w => w.training === training && w.exercises[exerciseIndex] && w.exercises[exerciseIndex].sets && w.exercises[exerciseIndex].sets.length > 0)
    .sort((a, b) => b.date.localeCompare(a.date));
  return filtered[0] || null;
}

// Тренировка "в процессе" — только если она НЕ завершена
function currentWorkout(training) {
  const t = today();
  return DB.workouts.find(w => 
    w.training === training && 
    w.date === t && 
    !w.finished
  );
}

function getOrCreateWorkout(training) {
  let w = currentWorkout(training);
  if (!w) {
    w = {
      id: Date.now(),
      training: training,
      date: today(),
      startedAt: Date.now(),
      finished: false,
      exercises: TRAININGS[training].exercises.map(() => ({ sets: [], note: '' }))
    };
    DB.workouts.push(w);
    saveData(DB);
  }
  if (!w.startedAt) {
    w.startedAt = Date.now();
    saveData(DB);
  }
  return w;
}

// ============================================================
// WORKOUT TIMER
// ============================================================
function startWorkoutTimer() {
  if (workoutTimerInterval) clearInterval(workoutTimerInterval);
  workoutTimerInterval = setInterval(updateWorkoutTimer, 1000);
  updateWorkoutTimer();
}

function stopWorkoutTimer() {
  if (workoutTimerInterval) {
    clearInterval(workoutTimerInterval);
    workoutTimerInterval = null;
  }
}

function updateWorkoutTimer() {
  const el = document.getElementById('workout-timer-val');
  if (!el) return;
  if (!state.training) return;
  const w = currentWorkout(state.training);
  if (!w || !w.startedAt) return;
  const elapsed = Math.floor((Date.now() - w.startedAt) / 1000);
  el.textContent = formatTime(elapsed);
}

// ============================================================
// REST TIMER
// ============================================================
function startRestTimer(seconds) {
  restSecondsLeft = seconds || DEFAULT_REST_SECONDS;
  const el = document.getElementById('restTimer');
  const val = document.getElementById('restVal');
  
  el.classList.add('show');
  val.textContent = formatTime(restSecondsLeft);
  
  if (restTimerInterval) clearInterval(restTimerInterval);
  restTimerInterval = setInterval(() => {
    restSecondsLeft--;
    if (restSecondsLeft <= 0) {
      stopRestTimer();
      showToast('Отдых закончен 💪');
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      return;
    }
    val.textContent = formatTime(restSecondsLeft);
  }, 1000);
}

function stopRestTimer() {
  if (restTimerInterval) {
    clearInterval(restTimerInterval);
    restTimerInterval = null;
  }
  const el = document.getElementById('restTimer');
  if (el) el.classList.remove('show');
}

// ============================================================
// RENDER
// ============================================================
function render() {
  const app = document.getElementById('app');
  
  if (state.screen === 'home') {
    app.innerHTML = renderHome();
    stopWorkoutTimer();
  } else if (state.screen === 'training') {
    app.innerHTML = renderTraining();
    startWorkoutTimer();
  } else if (state.screen === 'exercise') {
    app.innerHTML = renderExercise();
    if (!workoutTimerInterval && state.training) startWorkoutTimer();
  }
}

function renderHome() {
  let html = `
    <div class="header">
      <h1>Gym Tracker</h1>
    </div>
    <div class="content">
      <div class="section-title">Выбери тренировку</div>
  `;
  
  for (const key of ['A', 'B', 'D']) {
    const t = TRAININGS[key];
    const last = lastWorkout(key);
    const inProgress = currentWorkout(key);
    
    let lastText = 'Ещё не было';
    if (last && last.finished) {
      const dur = last.duration ? ` · ${formatTime(last.duration)}` : '';
      lastText = `Последняя: ${formatDate(last.date)}${dur}`;
    } else if (last) {
      lastText = `Последняя: ${formatDate(last.date)}`;
    }
    
    html += `
      <div class="training-card" onclick="openTraining('${key}')">
        <div class="label">${key}</div>
        <div class="name">${t.name}</div>
        <div class="count">${t.exercises.length} упражнений</div>
        <div class="last">${inProgress ? '⚡ В процессе' : lastText}</div>
      </div>
    `;
  }
  
  html += `</div>`;
  return html;
}

function renderTraining() {
  const t = TRAININGS[state.training];
  const workout = getOrCreateWorkout(state.training);
  
  let html = `
    <div class="header">
      <button class="back-btn visible" onclick="goHome()">‹ Назад</button>
      <div style="flex:1">
        <h1>Тренировка ${state.training}</h1>
        <div class="sub">${t.name}</div>
      </div>
    </div>
    <div class="workout-timer">
      <span>⏱ Время тренировки</span>
      <span class="val" id="workout-timer-val">00:00</span>
    </div>
    <div class="content">
  `;
  
  t.exercises.forEach((ex, i) => {
    const rec = workout.exercises[i];
    const done = rec.sets && rec.sets.length > 0;
    const hasNote = rec.note && rec.note.trim().length > 0;
    
    const lastRec = lastExerciseRecord(state.training, i);
    let prevText = 'Нет данных';
    if (lastRec) {
      const sets = lastRec.exercises[i].sets;
      prevText = sets.map(s => `${s.weight}×${s.reps}`).join(', ');
    }
    
    html += `
      <div class="exercise-item" onclick="openExercise(${i})">
        <div class="num" style="${done ? 'background:#4a9eff;color:#fff' : ''}">${done ? '✓' : i+1}</div>
        <div class="info">
          <div class="ex-name">${ex}${hasNote ? ' 📝' : ''}</div>
          <div class="ex-prev">${prevText}</div>
        </div>
        <div class="arrow">›</div>
      </div>
    `;
  });
  
  html += `
      <div class="btn-row">
        <button class="btn secondary" onclick="finishWorkout()">Завершить тренировку</button>
      </div>
    </div>
  `;
  
  return html;
}

function renderExercise() {
  const t = TRAININGS[state.training];
  const exName = t.exercises[state.exerciseIndex];
  const workout = getOrCreateWorkout(state.training);
  const rec = workout.exercises[state.exerciseIndex];
  
  const lastRec = lastExerciseRecord(state.training, state.exerciseIndex);
  const lastSets = lastRec ? lastRec.exercises[state.exerciseIndex].sets : [];
  
  // Автоподстановка
  if (rec.sets.length === 0 && lastSets.length > 0) {
    rec.sets = lastSets.map(s => ({ weight: s.weight, reps: s.reps }));
    saveData(DB);
  }
  
  const currentSets = rec.sets.length > 0 ? rec.sets : [{weight:'', reps:''}];
  
  let html = `
    <div class="header">
      <button class="back-btn visible" onclick="backToTraining()">‹ Назад</button>
      <h1 style="font-size:16px">${exName}</h1>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('workout')">Тренировка</div>
      <div class="tab" onclick="switchTab('history')">История</div>
      <div class="tab" onclick="switchTab('graph')">График</div>
    </div>
    <div class="content">
  `;
  
  if (state.tab === 'workout') {
    html += `
      <div class="section-title">Прошлая тренировка</div>
      <div class="sets-header">
        <div>#</div>
        <div>Вес (кг)</div>
        <div>Повторы</div>
      </div>
    `;
    
    if (lastSets.length === 0) {
      html += `<div style="text-align:center;color:#444;padding:20px;font-size:14px">Нет данных</div>`;
    } else {
      lastSets.forEach((s, i) => {
        html += `
          <div class="set-row">
            <div class="set-num">${i+1}</div>
            <input class="set-input prev" type="number" value="${s.weight}" disabled>
            <input class="set-input prev" type="number" value="${s.reps}" disabled>
          </div>
        `;
      });
    }
    
    html += `
      <div class="section-title">Эта тренировка</div>
      <div class="sets-header">
        <div>#</div>
        <div>Вес (кг)</div>
        <div>Повторы</div>
      </div>
      <div id="current-sets"></div>
      <div class="btn-row">
        <button class="btn secondary" onclick="removeSet()">− Убрать</button>
        <button class="btn secondary" onclick="addSet()">+ Добавить</button>
      </div>
      <div class="btn-row">
        <button class="btn success" onclick="saveSet()">✅ Сохранить подход</button>
      </div>
      <div class="btn-row">
        <button class="btn secondary" onclick="finishExercise()">🏁 Завершить упражнение</button>
      </div>
      
      <div class="section-title">Заметка</div>
      <textarea class="notes-input" id="notes-input" 
                placeholder="Как прошло? Что запомнить?"
                oninput="updateNote(this.value)">${rec.note || ''}</textarea>
      <div class="btn-row">
        <button class="btn secondary" onclick="saveNote()">Сохранить заметку</button>
      </div>
    `;
  } else if (state.tab === 'history') {
    html += renderHistory();
  } else if (state.tab === 'graph') {
    html += renderGraph();
  }
  
  html += `</div>`;
  
  setTimeout(() => {
    if (state.tab === 'workout') renderCurrentSets(currentSets);
  }, 0);
  
  return html;
}

function renderCurrentSets(sets) {
  const container = document.getElementById('current-sets');
  if (!container) return;
  
  let html = '';
  sets.forEach((s, i) => {
    html += `
      <div class="set-row">
        <div class="set-num">${i+1}</div>
        <input class="set-input current" type="number" inputmode="decimal" 
               value="${s.weight}" placeholder="—" 
               oninput="updateSet(${i}, 'weight', this.value)">
        <input class="set-input current" type="number" inputmode="numeric" 
               value="${s.reps}" placeholder="—" 
               oninput="updateSet(${i}, 'reps', this.value)">
      </div>
    `;
  });
  container.innerHTML = html;
}

function renderHistory() {
  const all = DB.workouts
    .filter(w => w.training === state.training)
    .filter(w => w.exercises[state.exerciseIndex] && w.exercises[state.exerciseIndex].sets.length > 0)
    .sort((a, b) => b.date.localeCompare(a.date));
  
  if (all.length === 0) {
    return `<div class="empty"><div class="icon">📊</div><div class="text">Нет данных</div></div>`;
  }
  
  let html = '';
  all.forEach(w => {
    const sets = w.exercises[state.exerciseIndex].sets;
    const note = w.exercises[state.exerciseIndex].note;
    html += `
      <div class="history-item">
        <div class="date">${formatDate(w.date)}</div>
        <div class="sets">
          ${sets.map(s => `<div class="set-chip">${s.weight} × ${s.reps}</div>`).join('')}
        </div>
        ${note ? `<div class="note">📝 ${note}</div>` : ''}
      </div>
    `;
  });
  return html;
}

function renderGraph() {
  const all = DB.workouts
    .filter(w => w.training === state.training)
    .filter(w => w.exercises[state.exerciseIndex] && w.exercises[state.exerciseIndex].sets.length > 0)
    .sort((a, b) => a.date.localeCompare(b.date));
  
  if (all.length < 2) {
    return `<div class="empty"><div class="icon">📈</div><div class="text">Нужно минимум 2 тренировки</div></div>`;
  }
  
  const points = all.map(w => {
    const sets = w.exercises[state.exerciseIndex].sets;
    const maxW = Math.max(...sets.map(s => parseFloat(s.weight) || 0));
    return { date: w.date, value: maxW };
  }).filter(p => p.value > 0);
  
  if (points.length < 2) {
    return `<div class="empty"><div class="icon">📈</div><div class="text">Нет данных о весе</div></div>`;
  }
  
  const maxV = Math.max(...points.map(p => p.value));
  const minV = Math.min(...points.map(p => p.value));
  const range = maxV - minV || 1;
  
  const W = 300;
  const H = 180;
  const padX = 10;
  const padY = 20;
  const graphW = W - padX * 2;
  const graphH = H - padY * 2;
  
  const coords = points.map((p, i) => {
    const x = padX + (i / (points.length - 1)) * graphW;
    const y = padY + graphH - ((p.value - minV) / range) * graphH;
    return { x, y, ...p };
  });
  
  const pathD = coords.map((c, i) => `${i === 0 ? 'M' : 'L'} ${c.x} ${c.y}`).join(' ');
  
  let svg = `<svg class="graph-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  
  for (let i = 0; i <= 4; i++) {
    const y = padY + (i / 4) * graphH;
    svg += `<line x1="${padX}" y1="${y}" x2="${W-padX}" y2="${y}" stroke="#262626" stroke-width="1"/>`;
  }
  
  svg += `<path d="${pathD}" fill="none" stroke="#4a9eff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  
  coords.forEach(c => {
    svg += `<circle cx="${c.x}" cy="${c.y}" r="4" fill="#4a9eff"/>`;
  });
  
  svg += `</svg>`;
  
  const first = points[0].value;
  const last = points[points.length - 1].value;
  const diff = last - first;
  const diffText = diff > 0 ? `+${diff}` : `${diff}`;
  
  return `
    <div class="graph-container">
      <div class="graph-title">Максимальный вес по тренировкам</div>
      ${svg}
      <div class="graph-stats">
        <div class="stat">
          <div class="stat-label">Сейчас</div>
          <div class="stat-value">${last} кг</div>
        </div>
        <div class="stat">
          <div class="stat-label">Прогресс</div>
          <div class="stat-value" style="color:${diff >= 0 ? '#4a9eff' : '#ff6b6b'}">${diffText} кг</div>
        </div>
        <div class="stat">
          <div class="stat-label">Тренировок</div>
          <div class="stat-value">${points.length}</div>
        </div>
      </div>
    </div>
  `;
}

// ============================================================
// ACTIONS
// ============================================================
function openTraining(key) {
  state.training = key;
  state.screen = 'training';
  render();
}

function goHome() {
  state.screen = 'home';
  state.training = null;
  state.exerciseIndex = null;
  state.tab = 'workout';
  stopWorkoutTimer();
  stopRestTimer();
  render();
}

function openExercise(index) {
  state.exerciseIndex = index;
  state.screen = 'exercise';
  state.tab = 'workout';
  render();
}

function backToTraining() {
  state.screen = 'training';
  state.exerciseIndex = null;
  state.tab = 'workout';
  render();
}

function switchTab(tab) {
  state.tab = tab;
  render();
}

function addSet() {
  const workout = getOrCreateWorkout(state.training);
  const rec = workout.exercises[state.exerciseIndex];
  if (rec.sets.length === 0) {
    rec.sets.push({weight:'', reps:''});
  }
  rec.sets.push({weight:'', reps:''});
  saveData(DB);
  render();
}

function removeSet() {
  const workout = getOrCreateWorkout(state.training);
  const rec = workout.exercises[state.exerciseIndex];
  if (rec.sets.length > 1) {
    rec.sets.pop();
    saveData(DB);
  }
  render();
}

function updateSet(index, field, value) {
  const workout = getOrCreateWorkout(state.training);
  const rec = workout.exercises[state.exerciseIndex];
  if (!rec.sets[index]) rec.sets[index] = {weight:'', reps:''};
  rec.sets[index][field] = value;
  saveData(DB);
}

function updateNote(value) {
  const workout = getOrCreateWorkout(state.training);
  const rec = workout.exercises[state.exerciseIndex];
  rec.note = value;
  saveData(DB);
}

function saveNote() {
  showToast('Заметка сохранена 📝');
}

// Сохранить подход (остаться в упражнении)
function saveSet() {
  const workout = getOrCreateWorkout(state.training);
  const rec = workout.exercises[state.exerciseIndex];
  
  rec.sets = rec.sets.filter(s => s.weight !== '' && s.reps !== '');
  saveData(DB);
  
  startRestTimer(DEFAULT_REST_SECONDS);
  showToast('Подход сохранён ✓ Отдых пошёл');
  
  render();
}

// Завершить упражнение (сохранить всё и выйти)
function finishExercise() {
  const workout = getOrCreateWorkout(state.training);
  const rec = workout.exercises[state.exerciseIndex];
  
  rec.sets = rec.sets.filter(s => s.weight !== '' && s.reps !== '');
  saveData(DB);
  
  stopRestTimer();
  showToast('Упражнение завершено ✓');
  backToTraining();
}

// Завершить тренировку (помечаем как finished)
function finishWorkout() {
  const workout = getOrCreateWorkout(state.training);
  const done = workout.exercises.filter(e => e.sets.length > 0).length;
  
  if (done === 0) {
    showToast('Нет сохранённых упражнений');
    return;
  }
  
  const elapsed = workout.startedAt ? Math.floor((Date.now() - workout.startedAt) / 1000) : 0;
  workout.duration = elapsed;
  workout.finished = true;
  workout.finishedAt = Date.now();
  saveData(DB);
  
  stopWorkoutTimer();
  stopRestTimer();
  
  showToast(`Тренировка завершена! Время: ${formatTime(elapsed)}`);
  setTimeout(goHome, 1500);
}

// ============================================================
// INIT
// ============================================================
render();
</script>
